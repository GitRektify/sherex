apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext.defaultEnvFile = ".env.debug"
project.ext.envConfigFiles = [
    debug: ".env.debug",
    internal: ".env.internal",
    release: ".env.production",
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // root = file("../../") // Uncomment and modify this if necessary for the root path of the project
    // reactNativeDir = file("../../node_modules/react-native") // Uncomment and modify if necessary
    // codegenDir = file("../../node_modules/@react-native/codegen") // Uncomment if necessary
    // cliFile = file("../../node_modules/react-native/cli.js") // Uncomment if necessary

    /* Variants */
    // debuggableVariants = ["liteDebug", "prodDebug"] // Uncomment if you're using custom variants

    /* Bundling */
    // nodeExecutableAndArgs = ["node"] // Default is 'node', no need to change
    // bundleCommand = "ram-bundle" // Default is 'ram-bundle', use if necessary
    // bundleConfig = file(../rn-cli.config.js) // Uncomment if you have a custom config
    // bundleAssetName = "MyApplication.android.bundle" // Uncomment if needed
    // entryFile = file("../js/MyApplication.android.js") // Modify entry file if necessary
    // extraPackagerArgs = [] // Add extra args to packager if necessary

    /* Hermes Commands */
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc" // Use custom Hermes if needed
    // hermesFlags = ["-O", "-output-source-map"] // Customize flags if required

    /* Autolinking */
    autolinkLibrariesWithApp() // Keep the autolinking enabled, unless you need to customize it

    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sherex"
    defaultConfig {
        applicationId "com.walletconnect.web3modal.rnsample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 115
        versionName "1.1"
        resValue "string", "build_config_package", "com.sherex"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation('com.airbnb.android:lottie')
    implementation('com.facebook.fresco:fresco:2.0.0')
    implementation('com.facebook.fresco:animated-gif:2.0.0') // Ensure this is necessary

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Make sure there's no reference to react-native-gif-controller-view
    // Remove any unwanted dependencies related to react-native-gif-controller-view if present
}
